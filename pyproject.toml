[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "osis-qa-comparison"
version = "0.1.0"
description = "Reproducible six-framework comparison for OSIS API question answering"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "opencode-ai==0.1.0a36",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
t2 = ["langchain==1.4.2", "langchain-openai==1.6.2", "langgraph==1.2.11"]
t3 = ["smolagents==1.26.0", "openai==2.54.0"]
t4 = ["openhands-sdk==1.49.2", "openhands-tools==1.49.5"]
t5 = ["crewai==1.15.22", "crewai-tools==1.15.22"]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["qa", "common", "baselines"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
